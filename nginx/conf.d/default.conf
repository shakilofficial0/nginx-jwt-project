server {
    listen 80;
    server_name _;

    location ~ ^/micro_images/(?<url_user_id>[^/]+)_images\.png$ {
        auth_request /auth;

        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;

        alias /var/www/html/images/${url_user_id}_image.png;

        limit_except GET { deny all; }
    }

    location = /auth {
        internal;
        js_content auth.verifyJwt;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"Unauthorized","message":"Missing or invalid JWT token"}';
    }

    location @forbidden {
        default_type application/json;
        return 403 '{"error":"Forbidden","message":"Token user_id does not match resource user_id"}';
    }
}
